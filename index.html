<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planning XLSX</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Planning par personne</h1>
        <p>Importez un fichier .xlsx et obtenez les jours de travail par personne.</p>
      </header>

      <section class="panel upload-panel">
        <label class="file-label" for="fileInput">Fichiers Excel (.xlsx)</label>
        <input id="fileInput" type="file" multiple accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
        <button id="parseBtn" type="button">Generer le planning</button>
        <p id="status" class="status">En attente d'un fichier.</p>
      </section>

      <section id="controls" class="panel controls hidden" aria-live="polite">
        <label for="personSearch">Rechercher une personne</label>
        <input id="personSearch" type="search" placeholder="Nom..." autocomplete="off" />

        <label for="personSelect">Ou selectionner</label>
        <select id="personSelect"></select>

        <label class="inline-check">
          <input id="showTasks" type="checkbox" />
          Afficher les taches assignees (si detectees)
        </label>

        <details class="sub-panel task-panel">
          <summary>Taches detectees (filtres)</summary>
          <p class="hint">Toutes les taches sont pre-cochees.</p>
          <div id="taskChecklist" class="task-checklist"></div>
        </details>
      </section>

      <section id="summary" class="panel summary hidden"></section>
      <section id="exportPanel" class="panel export-panel hidden">
        <h2>Export calendrier</h2>
        <p class="hint">Un evenement par jour pour la personne selectionnee.</p>
        <div class="export-actions">
          <button id="exportIcsBtn" type="button">Exporter ICS</button>
          <button id="shareIcsBtn" type="button">Partager calendrier</button>
        </div>
      </section>
      <section id="personView" class="person-view"></section>
    </main>
  </body>
</html>
